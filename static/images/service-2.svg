<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#022C22"/>
      <stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="card2" x1="50" y1="40" x2="350" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#065F46" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="speedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg2)"/>
  
  <!-- Glowing orbs -->
  <circle cx="200" cy="140" r="100" fill="#10B981" opacity="0.2" filter="url(#glow2)"/>
  <circle cx="340" cy="220" r="70" fill="#34D399" opacity="0.15" filter="url(#glow2)"/>

  <!-- Main Speed Card -->
  <rect x="45" y="40" width="310" height="220" rx="14" fill="url(#card2)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Performance Metric Header -->
  <rect x="70" y="65" width="80" height="24" rx="12" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="110" y="80" fill="#34D399" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle" dominant-baseline="middle">Bun SSR</text>

  <!-- Giant Latency Metric -->
  <text x="70" y="132" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="38" letter-spacing="-1">0.8 ms</text>
  <text x="70" y="152" fill="#94A3B8" font-family="sans-serif" font-size="12">Average server-side response time</text>

  <!-- Chart visual -->
  <path d="M70 215 C110 200, 150 210, 190 180 C230 150, 270 170, 315 130" stroke="url(#speedGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  
  <!-- Fill under chart -->
  <path d="M70 215 C110 200, 150 210, 190 180 C230 150, 270 170, 315 130 V225 H70 Z" fill="url(#speedGrad)" opacity="0.12"/>

  <!-- Glowing point at end of chart -->
  <circle cx="315" cy="130" r="6" fill="#34D399"/>
  <circle cx="315" cy="130" r="12" fill="#34D399" opacity="0.4" filter="url(#glow2)"/>

  <!-- Fast Badge on Right -->
  <g transform="translate(250, 60)">
    <rect width="80" height="32" rx="8" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <circle cx="15" cy="16" r="4" fill="#10B981"/>
    <text x="46" y="17" fill="#6EE7B7" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle" dominant-baseline="middle">100% TTFB</text>
  </g>
</svg>
