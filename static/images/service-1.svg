<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="card1" x1="50" y1="40" x2="350" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#312E81" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1E293B" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg1)"/>
  
  <!-- Glowing aura -->
  <circle cx="100" cy="80" r="80" fill="#6366F1" opacity="0.25" filter="url(#glow1)"/>
  <circle cx="320" cy="220" r="90" fill="#818CF8" opacity="0.2" filter="url(#glow1)"/>

  <!-- Code Editor Card -->
  <rect x="40" y="35" width="320" height="230" rx="14" fill="url(#card1)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Header Bar -->
  <path d="M40 49C40 41.268 46.268 35 54 35H346C353.732 35 360 41.268 360 49V68H40V49Z" fill="rgba(0,0,0,0.3)"/>
  
  <!-- Window Controls -->
  <circle cx="58" cy="51" r="3.5" fill="#EF4444" opacity="0.9"/>
  <circle cx="70" cy="51" r="3.5" fill="#F59E0B" opacity="0.9"/>
  <circle cx="82" cy="51" r="3.5" fill="#10B981" opacity="0.9"/>

  <!-- File Tab -->
  <rect x="100" y="43" width="105" height="18" rx="4" fill="rgba(255,255,255,0.08)"/>
  <text x="152" y="55" fill="#E2E8F0" font-family="monospace" font-size="9" text-anchor="middle" dominant-baseline="middle">Route.purs</text>

  <!-- Compile Status Pill -->
  <g transform="translate(258, 43)">
    <rect width="88" height="18" rx="9" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <circle cx="10" cy="9" r="3" fill="#10B981"/>
    <text x="48" y="10" fill="#6EE7B7" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle" dominant-baseline="middle">Typechecked</text>
  </g>

  <!-- Code Editor Body -->
  <g transform="translate(60, 85)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="0">
    <!-- Line 1: Type declaration -->
    <text y="14" fill="#F472B6" font-weight="600">data <tspan fill="#60A5FA">Route</tspan> <tspan fill="#94A3B8">=</tspan> <tspan fill="#E2E8F0">Home</tspan> <tspan fill="#94A3B8">|</tspan> <tspan fill="#E2E8F0">PostDetail</tspan> <tspan fill="#34D399">Int</tspan></text>
    
    <!-- Line 2: Function signature -->
    <text y="36" fill="#818CF8" font-weight="600">view <tspan fill="#94A3B8">::</tspan> <tspan fill="#60A5FA">Route</tspan> <tspan fill="#94A3B8">-&gt;</tspan> <tspan fill="#60A5FA">Html</tspan></text>
    
    <!-- Line 3: Total pattern matching -->
    <text y="58" fill="#818CF8" font-weight="600">view <tspan fill="#94A3B8">=</tspan> <tspan fill="#F472B6">case</tspan> <tspan fill="#FDE047">_</tspan> <tspan fill="#F472B6">of</tspan></text>
    <text y="80" fill="#E2E8F0">  <tspan fill="#60A5FA">Home</tspan> <tspan fill="#94A3B8">-&gt;</tspan> <tspan fill="#34D399">renderHome</tspan></text>
    <text y="102" fill="#E2E8F0">  <tspan fill="#60A5FA">PostDetail</tspan> <tspan fill="#FDE047">id</tspan> <tspan fill="#94A3B8">-&gt;</tspan> <tspan fill="#34D399">renderPost</tspan> <tspan fill="#FDE047">id</tspan></text>
  </g>

  <!-- Invariant Footer Bar -->
  <g transform="translate(60, 215)">
    <rect width="280" height="34" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="18" cy="17" r="7" fill="rgba(99,102,241,0.25)"/>
    <!-- Lock/Shield icon -->
    <path d="M15 17V15C15 13.343 16.343 12 18 12C19.657 12 21 13.343 21 15V17M14 17H22V21H14V17Z" stroke="#818CF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="35" y="15" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="10">Exhaustive Pattern Matching</text>
    <text x="35" y="27" fill="#94A3B8" font-family="sans-serif" font-size="9">Zero runtime exceptions • Algebraic Html ADT</text>
  </g>
</svg>
