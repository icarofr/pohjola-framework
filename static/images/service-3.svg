<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#022C22"/>
      <stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="card3" x1="50" y1="40" x2="350" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#065F46" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg3)"/>
  
  <!-- Glowing aura -->
  <circle cx="100" cy="90" r="80" fill="#34D399" opacity="0.15" filter="url(#glow3)"/>
  <circle cx="300" cy="210" r="90" fill="#10B981" opacity="0.2" filter="url(#glow3)"/>

  <!-- Interactive Component Mockup -->
  <rect x="45" y="40" width="310" height="220" rx="14" fill="url(#card3)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Component Header -->
  <rect x="70" y="65" width="120" height="24" rx="12" fill="rgba(52,211,153,0.15)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
  <text x="130" y="80" fill="#34D399" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle" dominant-baseline="middle">Typed Alpine.js</text>

  <!-- Reactive Switch Mockup -->
  <g transform="translate(70, 110)">
    <rect width="120" height="42" rx="21" fill="#059669"/>
    <circle cx="98" cy="21" r="16" fill="#FFFFFF"/>
    <!-- Checkmark inside toggle knob -->
    <path d="M93 21L96 24L103 17" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="35" y="25" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="11">Active</text>
  </g>

  <!-- Counter / State Pill -->
  <g transform="translate(205, 110)">
    <rect width="125" height="42" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="25" y="25" fill="#94A3B8" font-family="sans-serif" font-size="11">Count:</text>
    <rect x="75" y="10" width="36" height="22" rx="4" fill="#10B981"/>
    <text x="93" y="24" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">42</text>
  </g>

  <!-- Interactive Fragment Swap Indicator -->
  <g transform="translate(70, 175)">
    <rect width="260" height="60" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="25" cy="30" r="10" fill="rgba(52,211,153,0.2)"/>
    <path d="M21 30L24 33L29 27" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    <text x="45" y="26" fill="#FFFFFF" font-family="monospace" font-size="11">x-target.push="content"</text>
    <text x="45" y="44" fill="#94A3B8" font-family="sans-serif" font-size="10">Zero custom JS • Instant morph swap</text>
  </g>
</svg>
