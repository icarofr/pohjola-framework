name: suite
vars: { app: http://app:3000 }
testcases:
- name: root redirects to language
  steps:
  - type: http
    method: GET
    url: "{{.app}}/"
    no_follow_redirect: true
    assertions:
    - result.statuscode ShouldEqual 302
    - result.headers.Location ShouldMatchRegex "^/(en|fr)$"
    - result.headers.Vary ShouldContainSubstring "Accept-Language"
    - result.headers.X-Request-Id ShouldNotBeEmpty

- name: en home returns 200
  steps:
  - type: http
    method: GET
    url: "{{.app}}/en"
    assertions:
    - result.statuscode ShouldEqual 200
    - result.body ShouldContainSubstring "Pohjola"

- name: fr home returns 200
  steps:
  - type: http
    method: GET
    url: "{{.app}}/fr"
    assertions:
    - result.statuscode ShouldEqual 200
    - result.body ShouldContainSubstring "Pohjola"

- name: en about returns 200
  steps:
  - type: http
    method: GET
    url: "{{.app}}/en/about"
    assertions:
    - result.statuscode ShouldEqual 200
    - result.body ShouldContainSubstring "About"

- name: fr about returns 200
  steps:
  - type: http
    method: GET
    url: "{{.app}}/fr/about"
    assertions:
    - result.statuscode ShouldEqual 200
    - result.body ShouldContainSubstring "À propos"

- name: robots.txt returns 200
  steps:
  - type: http
    method: GET
    url: "{{.app}}/robots.txt"
    assertions:
    - result.statuscode ShouldEqual 200
    - result.body ShouldContainSubstring "User-agent"

- name: sitemap.xml returns 200
  steps:
  - type: http
    method: GET
    url: "{{.app}}/sitemap.xml"
    assertions:
    - result.statuscode ShouldEqual 200
    - result.body ShouldContainSubstring "urlset"

- name: css returns 200
  steps:
  - type: http
    method: GET
    url: "{{.app}}/css/styles.css"
    assertions:
    - result.statuscode ShouldEqual 200

- name: server.js returns 404
  steps:
  - type: http
    method: GET
    url: "{{.app}}/server.js"
    assertions:
    - result.statuscode ShouldEqual 404

- name: unknown route returns 404
  steps:
  - type: http
    method: GET
    url: "{{.app}}/en/nonexistent"
    assertions:
    - result.statuscode ShouldEqual 404

- name: unknown language returns 404
  steps:
  - type: http
    method: GET
    url: "{{.app}}/de"
    assertions:
    - result.statuscode ShouldEqual 404

- name: HEAD /en returns 200
  steps:
  - type: http
    method: HEAD
    url: "{{.app}}/en"
    assertions:
    - result.statuscode ShouldEqual 200

- name: OPTIONS /en returns 405
  steps:
  - type: http
    method: OPTIONS
    url: "{{.app}}/en"
    assertions:
    - result.statuscode ShouldEqual 405

- name: GET /en with datastar-request returns a patch
  steps:
  - type: http
    method: GET
    url: "{{.app}}/en"
    headers: { datastar-request: "true" }
    assertions:
    - result.statuscode ShouldEqual 200
    - result.body ShouldContainSubstring "event: datastar-patch-elements"
    - result.body ShouldContainSubstring "data-page-title"
    - result.body ShouldNotContainSubstring "<!DOCTYPE"