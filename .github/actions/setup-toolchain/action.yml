# Pinned CI toolchain — Bun only.
#
# PureScript (purs) is a devDependency; `bun install` provides node_modules/.bin/purs.
# Spago output is cached keyed on spago.lock.
name: Setup Pohjola toolchain
description: Bun (latest stable) + Spago output cache
inputs:
  cache-spago:
    description: Restore/save .spago and output caches
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install Bun (latest stable, cached)
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    - name: Cache Spago packages and compiler output
      if: inputs.cache-spago == 'true'
      uses: actions/cache@v4
      with:
        path: |
          .spago
          output
        key: spago-${{ runner.os }}-${{ hashFiles('spago.lock') }}
        restore-keys: |
          spago-${{ runner.os }}-
