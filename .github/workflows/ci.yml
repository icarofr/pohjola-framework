name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun (canary)
        run: curl -fsSL https://bun.sh/install | bash -s canary

      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install PureScript toolchain
        run: |
          sudo curl -fsSL https://github.com/purescript/purescript/releases/download/v0.15.16/linux64.tar.gz | sudo tar -xz -C /usr/local/bin --strip-components=1 purescript/purs
          bun add -g spago@1.0.4

      - name: Install dependencies (Tailwind, esbuild)
        run: bun install --frozen-lockfile

      - name: Install PureScript dependencies (locked, no network)
        run: spago install --pure

      - name: Format check (purs-tidy)
        run: make format-check

      - name: Gate (unsafe fns, FFI, HTML escape hatch) + build
        run: make gate build assets-check

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            dist-server/

  test:
    name: Unit + Property Tests (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun (canary)
        run: curl -fsSL https://bun.sh/install | bash -s canary

      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install PureScript toolchain
        run: |
          sudo curl -fsSL https://github.com/purescript/purescript/releases/download/v0.15.16/linux64.tar.gz | sudo tar -xz -C /usr/local/bin --strip-components=1 purescript/purs
          bun add -g spago@1.0.4

      - name: Install dependencies
        run: bun install --frozen-lockfile && spago install --pure && make assets

      - name: Gate (unsafe fns, FFI, HTML escape hatch)
        run: make gate

      # Run the compiled suite under Bun for runtime parity with production
      # (Bun canary — required for Bun.serve routes). `spago test`
      # hardcodes the Node runner (no flag/env override), so compile with
      # `spago build` (already includes test modules) and invoke the compiled
      # Test.Main entry with Bun directly.
      - name: Unit/property tests (Bun)
        run: |
          spago build --pure
          bun -e "import { main } from './output/Test.Main/index.js'; main()"

  integration:
    name: Integration Tests (Venom)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Run Venom tests via Docker Compose
        run: make test/integration

      - name: Tear down
        if: always()
        run: make test/integration/down

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun (canary)
        run: curl -fsSL https://bun.sh/install | bash -s canary

      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install PureScript toolchain
        run: |
          sudo curl -fsSL https://github.com/purescript/purescript/releases/download/v0.15.16/linux64.tar.gz | sudo tar -xz -C /usr/local/bin --strip-components=1 purescript/purs
          bun add -g spago@1.0.4

      - name: Install dependencies
        run: bun install --frozen-lockfile && spago install --pure && make assets

      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium

      - name: Build assets (Playwright webServer runs `make run`)
        run: make build

      - name: Run Playwright tests
        run: bun run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
